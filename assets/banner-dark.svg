  <text x="962" y="212" class="m tx" font-size="15" font-weight="700">mobil/</text><text x="962" y="231" class="s ok" font-size="13.5">✓ birleşti</text>
  <path d="M862 180.0 C900 180.0 890 281.0 928 281.0" stroke="#8b949e" stroke-opacity="0.8" stroke-width="1.6" class="akis" fill="none"/>
